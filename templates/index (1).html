<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmotionAI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<h1>Deep Learning Framework for Textual Sentiment Recognition</h1>

<div class="container">

    <h2>Explore EmotionAI – Understand Emotions Through Text!</h2>

    <p>
Textual data is analyzed to determine the emotional tone present in it.
The output reflects the dominant emotion identified from the input.    </p>

    <label>Enter your text:</label>

    <textarea id="textInput" placeholder="Type your text here..."></textarea>

    <br>

    <button onclick="predictEmotion()">Predict Emotion</button>

    <div class="result" id="result"></div>

</div>

<script>
function getEmoji(emotion) {
    const emojis = {
        joy: "😊",
        fear: "😨",
        anger: "😡",
        sadness: "😢",
        disgust: "🤢",
        shame: "😳",
        guilt: "😔"
    };
    return emojis[emotion] || "";
}

function predictEmotion() {
    let text = document.getElementById("textInput").value;

    if (text.trim() === "") {
        alert("Please enter text");
        return;
    }

    fetch("/predict", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ text: text })
    })
    .then(response => response.json())
    .then(data => {
        if (data.error) {
            document.getElementById("result").innerText = data.error;
        } else {
            let emoji = getEmoji(data.emotion);
            document.getElementById("result").innerText =
                "Predicted Emotion: " + data.emotion + " " + emoji;
        }
    })
    .catch(error => {
        document.getElementById("result").innerText = "Error: " + error;
    });
}
</script>

</body>
</html>
